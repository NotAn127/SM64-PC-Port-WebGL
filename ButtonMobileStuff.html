<!DOCTYPE html>
<html>
<head>
  <title>SM64 Sprite Sheet Generator</title>
  <style>
    body {
      background: #222;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    canvas {
      /* The checkerboard pattern helps you see that the background is transparent */
      background-image: linear-gradient(45deg, #333 25%, transparent 25%), 
                        linear-gradient(-45deg, #333 25%, transparent 25%), 
                        linear-gradient(45deg, transparent 75%, #333 75%), 
                        linear-gradient(-45deg, transparent 75%, #333 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      border: 2px solid #555;
      margin: 20px auto;
      display: block;
      border-radius: 8px;
    }
    button {
      background: #00aeff;
      color: #000;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    button:hover {
      background: #00e5ff;
    }
  </style>
</head>
<body>
  <h2>SM64 Button Sprite Generator</h2>
  <p>Click below to download the perfectly mapped transparent sprite sheet.</p>
  <button onclick="downloadImage()">Download buttons.png</button>
  
  <canvas id="canvas" width="500" height="500"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Helper function to draw circular buttons
    function drawCircle(x, y, radius, color, text) {
      ctx.beginPath();
      ctx.arc(x + radius, y + radius, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.stroke();
      
      if(text) {
        ctx.fillStyle = color === 'rgba(255, 200, 0, 0.6)' ? '#000' : '#fff';
        ctx.font = 'bold ' + (radius * 0.8) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + radius, y + radius);
      }
    }

    // Helper function to draw rounded rectangles
    function drawRect(x, y, w, h, color, text) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 10);
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.stroke();
      
      if(text) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, x + (w/2), y + (h/2));
      }
    }

    // --- DRAWING THE SPRITES AT THE EXACT CSS COORDINATES ---

    // 1. Joystick Base (Position: 0, 0 | Size: 140x140)
    ctx.beginPath();
    ctx.arc(70, 70, 68, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.setLineDash([8, 8]);
    ctx.stroke();
    ctx.setLineDash([]); // Reset line dash for other buttons

    // 2. Joystick Knob (Position: 150, 0 | Size: 60x60)
    drawCircle(150, 0, 30, 'rgba(200, 200, 200, 0.8)');

    // 3. Action Buttons (Row starts at Y: 150)
    drawCircle(0, 150, 30, 'rgba(0, 200, 0, 0.6)', 'A');        // A: 60x60
    drawCircle(70, 150, 25, 'rgba(200, 0, 0, 0.6)', 'B');       // B: 50x50
    drawCircle(130, 150, 25, 'rgba(0, 100, 255, 0.6)', 'Z');    // Z: 50x50
    drawRect(200, 150, 70, 40, 'rgba(150, 150, 150, 0.6)', 'R'); // R: 70x40
    drawRect(280, 150, 70, 35, 'rgba(150, 150, 150, 0.6)', 'START'); // Start: 70x35

    // 4. C-Buttons (Row starts at Y: 220)
    let cYellow = 'rgba(255, 200, 0, 0.6)';
    drawCircle(0, 220, 20, cYellow, 'C▲');    // C-Up: 40x40
    drawCircle(50, 220, 20, cYellow, 'C▼');   // C-Down: 40x40
    drawCircle(100, 220, 20, cYellow, 'C◄');  // C-Left: 40x40
    drawCircle(150, 220, 20, cYellow, 'C►');  // C-Right: 40x40

    // Export function
    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'buttons.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
